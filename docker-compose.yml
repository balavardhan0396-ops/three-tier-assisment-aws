services:

  mysql:
    image: mysql:8.0
    container_name: employee-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: employee_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - employee-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: employee-backend
    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: employee_db
      PORT: 5000

    ports:
      - "5000:5000"

    networks:
      - employee-network

  frontend:
    build:
      context: ./frontend

    container_name: employee-frontend
    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - employee-network

volumes:
  mysql_data:

networks:
  employee-network:
    driver: bridge
